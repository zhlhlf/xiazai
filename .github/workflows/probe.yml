name: Probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          U="https://www.xvideos.com/video.omlffop059c/_"
          t() {
            local label="$1"; shift
            curl -sL --compressed -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' -e "https://www.xvideos.com/" "$@" -o /tmp/p -w "$label http=%{http_code} size=%{size_download}\n" "$U"
            echo "   HLS=$(grep -c 'setVideoHLS' /tmp/p) High=$(grep -c 'setVideoUrlHigh' /tmp/p) m3u8=$(grep -c 'm3u8' /tmp/p) agate=$(grep -c 'age_verified\|AgeVerified' /tmp/p)"
            grep -oE "setVideoHLS\('[^']+'" /tmp/p | head -1
          }
          t "none      "
          t "age=1     " -b "age_verified=1"
          t "age=xv    " -b "age_verified=1; xv_age_gate=1"
          t "age=confirm" -b "age_verified=1; age_confirmed=1"
          echo "== 先访问首页拿 cookie 再进 =="
          curl -sL --compressed -A "$UA" -c /tmp/cj -o /dev/null "https://www.xvideos.com/"
          t "jar       " -b /tmp/cj -c /tmp/cj
          grep -oE 'setVideoHLS\(.[^)]*' /tmp/p | head -2
