name: Probe

on:
  workflow_dispatch:

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          XVCOOKIE: ${{ secrets.XVCOOKIE }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:153.0) Gecko/20100101 Firefox/153.0"
          for U in \
            "https://www.xvideos.com/video.ukiafbf4420/_souai_couple_" \
            "https://www.xvideos.com/video.kfokofb3aca/_souai_"; do
            echo "===== $U"
            curl -sL --compressed -A "$UA" \
              -H "Cookie: $XVCOOKIE" \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: zh-CN,zh;q=0.9,zh-TW;q=0.8,zh-HK;q=0.7,en-US;q=0.6,en;q=0.5' \
              -e "https://www.xvideos.com/" \
              -o /tmp/p -w 'http=%{http_code} size=%{size_download} final=%{url_effective}\n' "$U" || true
            echo "-- title: $(grep -oE '<title>[^<]*' /tmp/p | head -1)"
            grep -oE "setVideoHLS\('[^']*'" /tmp/p | head -1
            grep -oE "setVideoUrlHigh\('[^']*'" /tmp/p | head -1
            grep -oE "setVideoUrlLow\('[^']*'" /tmp/p | head -1
            h=$(grep -oE "setVideoHLS\('[^']*'" /tmp/p | head -1 | cut -d"'" -f2)
            if [ -n "$h" ]; then echo "-- master:"; curl -sL --compressed -A "$UA" -H "Cookie: $XVCOOKIE" "$h" | grep -E 'RESOLUTION|hls-' | head -12; fi
          done
