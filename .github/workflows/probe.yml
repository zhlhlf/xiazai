name: Probe

on:
  workflow_dispatch:

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          XVCOOKIE: ${{ secrets.XVCOOKIE }}
        run: |
          U="https://www.xvideos.com/video.ukiafbf4420/_souai_couple_"
          UAF="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:153.0) Gecko/20100101 Firefox/153.0"
          UAC="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          echo "cookie_len=${#XVCOOKIE}"
          for pair in "FIREFOX|$UAF" "CHROME|$UAC"; do
            label="${pair%%|*}"; ua="${pair#*|}"
            for mode in cookie anon; do
              if [ "$mode" = cookie ]; then H=(-H "Cookie: $XVCOOKIE"); else H=(); fi
              code=$(curl -sL --compressed -A "$ua" "${H[@]}" -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.8' -e "https://www.xvideos.com/" -o /tmp/p -D /tmp/h -w '%{http_code}' "$U" || true)
              echo "$label/$mode code=$code size=$(wc -c </tmp/p) title=$(grep -oE '<title>[^<]*' /tmp/p | head -1)"
              echo "   setcookie_names: $(grep -i '^set-cookie' /tmp/h | sed 's/=.*//' | tr -d '\r' | tr '\n' ' ')"
            done
          done
